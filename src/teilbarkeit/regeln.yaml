            },
            {
              "type": "definition",
              "term": "Faktor",
              "explanation": "Die Zahlen, die du miteinander multiplizierst, heißen Faktoren. Das Ergebnis heißt Produkt. Bei 3 · 4 = 12 sind 3 und 4 die Faktoren.",
