  "scope": "Faktor und Produkt an Reihen von Bauklötzen erläutern. Zusammengesetzte Zahlen wiederholt in Faktoren größer als 1 zerlegen; am Ende bleiben Primzahlen. Primzahlen größer als 1 haben genau zwei positive Teiler, 1 ist keine Primzahl. Erst danach Teilbarkeitsregeln als Abkürzungen nutzen.",
