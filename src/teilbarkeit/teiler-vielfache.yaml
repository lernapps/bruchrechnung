              "nojs": "Die beiden Reihen zeigen 12 und 18 gleich große Plättchen. Verändere die Gruppengröße. Die gestrichelten Umrandungen bündeln Plättchen; übrig gebliebene Plättchen stehen außerhalb vollständiger Gruppen. Suche eine Gruppengröße, die beide Reihen ohne Rest aufteilt. Gibt es eine größere passende Größe? Die größte ist der ggT. Die Reihen sind verschieden lang, aber jedes einzelne Plättchen ist gleich groß.\n\nBei Gruppengröße 6 entstehen aus 12 Plättchen zwei und aus 18 Plättchen drei vollständige Gruppen ohne Rest. 6 ist die größte Gruppengröße, die zu beiden Mengen passt: ggT(12,18) = 6.",
