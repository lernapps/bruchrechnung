  "title": "Bruch und Dezimalzahl",
  "description": "Ein Anteil kann verschiedene Schreibweisen haben. Wie passen Viertel zu Hundertsteln?",
  "scope": "Zehntel, Hundertstel und Tausendstel gehören zu den Stellen nach dem Komma. 3/4 = 75/100 = 0,75. Allgemein kannst du den Zähler durch den Nenner teilen. Die Division endet oder wird periodisch. Bei vollständig gekürzten Brüchen endet sie genau dann, wenn der Nenner nur Primfaktoren 2 und 5 enthält. 1/8 = 0,125. Bei 1/3 wiederholt sich die 3 ohne Ende: 0,333… . Das ist nicht genau 0,33; 0,33 ist nur eine Näherung. Einfache Prozentangaben sind Hundertstel: 25 % = 25/100 = 1/4.",
