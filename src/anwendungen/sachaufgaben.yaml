              "text": "Drei Viertel Liter Saft sollen gleichmäßig auf zwei Gefäße verteilt werden. Gesucht ist die Saftmenge in EINEM Gefäß. Stell dir einen Liter als Streifen mit vier gleich großen Abschnitten vor. Drei Abschnitte enthalten Saft. Teile jeden dieser drei Abschnitte noch einmal in zwei gleich große Stücke. Gib von jedem Paar ein Stück in jedes Gefäß. So bekommt jedes Gefäß gleich viel. Schreibe danach auf, welcher Anteil eines Liters in einem Gefäß ist. Bei den Übungen klärst du genauso zuerst: Was ist gegeben, was wird gesucht und in welcher Einheit?",
