            {
              "type": "text",
              "text": "Auf dieser Seite geht es um Plus und Minus. Schreibe die Zahlen so untereinander, dass gleiche Stellenwerte in derselben Spalte stehen: Komma unter Komma. Ergänze bei Bedarf Nullen am Ende, etwa 0,5 = 0,50. Die folgenden Tabellen zeigen die Stellen getrennt, damit du gleich große Teile zusammenlegen oder wegnehmen kannst.",
            },
            {
              "type": "section",
              "id": "addition",
              "title": "Plus: gleich große Teile zusammenlegen",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "In der Tabelle stehen sieben Zehntel und fünf Hundertstel in der ersten Zahl, fünf Zehntel und null Hundertstel in der zweiten. Lege Hundertstel zu Hundertsteln und Zehntel zu Zehnteln. Werden es zehn kleinere Teile, kannst du sie gegen einen Teil der nächstgrößeren Sorte tauschen.",
                  },
                  {
                    "type": "table",
                    "caption": "Beide Zahlen sind nach Stellenwerten ausgerichtet",
                    "header": ["Zahl", "Ganze", "Zehntel", "Hundertstel"],
                    "rows": [["0,75", "0", "7", "5"], ["0,50", "0", "5", "0"]],
                  },
                ],
            },
            {
              "type": "section",
              "id": "subtraktion",
              "title": "Minus: bei Bedarf in kleinere Teile tauschen",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "Beim Subtrahieren nimmst du gleich große Teile weg. Wenn an einer Stelle zu wenig vorhanden ist, tauschst du einen größeren Teil in zehn kleinere: ein Ganzes in zehn Zehntel oder ein Zehntel in zehn Hundertstel. Der Wert der Zahl bleibt dabei gleich. Bei 1,20 − 0,35 reicht es nicht, nur die Ziffern direkt voneinander abzuziehen; zuerst musst du tauschen.",
                  },
                  {
                    "type": "table",
                    "caption": "Der Anfang der Minusrechnung",
                    "header": ["Zahl", "Ganze", "Zehntel", "Hundertstel"],
                    "rows": [["1,20", "1", "2", "0"], ["0,35", "0", "3", "5"]],
                  },
                ],
            },
          ],
      },
      {
        "type": "section",
