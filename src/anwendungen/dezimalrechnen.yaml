{
  "title": "Dezimalzahlen addieren und subtrahieren",
  "description": "Gleiche Stellenwerte zusammenlegen oder wegnehmen: Komma unter Komma.",
  "scope": "Addition und Subtraktion von Dezimalzahlen werden getrennt hergeleitet. Gleiche Stellenwerte stehen untereinander, Komma unter Komma. Endnullen hinter dem Komma ändern den Wert nicht. Bei der Addition werden zehn Hundertstel zu einem Zehntel und zehn Zehntel zu einem Ganzen gebündelt. 0,75 + 0,50 = 1,25. Bei der Subtraktion können größere Stellenwerte in zehn kleinere getauscht werden. 1,20 sind 11 Zehntel und 10 Hundertstel; davon 3 Zehntel und 5 Hundertstel weggenommen ergeben 0,85. Also 1,20 − 0,35 = 0,85. Die Übungen enthalten ausschließlich Addition und Subtraktion, keine Punktrechnung.",
  "blocks":
    [
      {
        "type": "section",
        "id": "regel",
        "title": "Gleiche Stellen gehören zusammen",
        "blocks":
          [
            {
              "type": "text",
              "text": "Du hast 0,75 Euro und bekommst 0,50 Euro dazu. Beim Zusammenlegen rechnest du Euro zu Euro und Cent zu Cent. Beim Ausgeben nimmst du solche Beträge wieder weg. Bei Dezimalzahlen helfen dir dafür die Stellenwerte: Ganze, Zehntel, Hundertstel.",
            },
            {
              "type": "definition",
              "term": "Stellenwert",
              "explanation": "Der Stellenwert sagt, ob eine Ziffer Einer, Zehntel, Hundertstel oder eine andere Zehnerpotenz zählt.",
            },
          ],
      },
      {
        "type": "section",
        "id": "entdecken",
        "title": "Anschaulich erklärt",
        "blocks":
