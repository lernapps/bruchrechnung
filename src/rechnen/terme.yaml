{
  "title": "Rechenregeln und Klammern",
  "description": "Welcher Schritt muss zuerst kommen? Vergleiche unterschiedliche Gruppierungen.",
  "scope": "Klammern zuerst, dann Punktrechnung vor Strichrechnung. Addition und Multiplikation sind vertauschbar und dürfen umgruppiert werden. Das Distributivgesetz verteilt eine Multiplikation auf eine Summe: a · (b + c) = a · b + a · c. Diese Regeln gelten nicht entsprechend für Subtraktion und Division. 1/2 + 1/3 · 3 = 1/2 + 1 = 3/2. Mit Klammern: (1/2 + 1/3) · 3 = 5/6 · 3 = 5/2. Die Klammer verändert die Reihenfolge.",
  "blocks":
