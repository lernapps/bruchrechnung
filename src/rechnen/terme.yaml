                  {
                    "type": "text",
                    "text": "Klammern zuerst, dann Punktrechnung vor Strichrechnung. Addition und Multiplikation sind vertauschbar und dürfen umgruppiert werden. Das Distributivgesetz verteilt eine Multiplikation auf eine Summe: a · (b + c) = a · b + a · c. Diese Regeln gelten nicht entsprechend für Subtraktion und Division.",
                  },
                ],
            },
          ],
