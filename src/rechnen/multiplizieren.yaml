  "title": "Brüche multiplizieren",
  "description": "Was bedeutet zwei Drittel von drei Vierteln? Unterteile ein Rechteck in beide Richtungen.",
  "scope": "Ein Anteil von einem Anteil wird multipliziert: Zähler mal Zähler und Nenner mal Nenner. Du darfst gemeinsame Faktoren eines Zählers und eines Nenners vorher kürzen. Beim Multiplizieren mit einem Bruch zwischen 0 und 1 wird eine positive Zahl kleiner. 2/3 · 3/4 = 6/12 = 1/2. Im Rechteck sind drei von vier Spalten ausgewählt. Zwei von drei Zeilen davon ergeben sechs von zwölf Feldern.",
