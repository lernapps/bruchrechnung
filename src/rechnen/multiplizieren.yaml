              "text": "Eine Malaufgabe kannst du als Rechteck sehen: Die beiden Faktoren geben seine Seitenlängen an. Bei 3 · 2 passt ein Rechteck mit 3 Spalten und 2 Zeilen. Bei Brüchen hilft dieselbe Idee: Das große Rechteck steht für ein Ganzes. Teile seine Breite und Höhe in gleich große Abschnitte. Der eine Bruch bestimmt die Breite, der andere die Höhe des kleineren Rechtecks. Unten erkennst du den waagerechten Anteil an Blau und senkrechten Strichen, den senkrechten Anteil an Orange und waagerechten Strichen. Folge diesen Abschnitten ins Rechteck. Markiere nur die Felder, die zu BEIDEN Anteilen gehören. Vergleiche die markierten Teilflächen mit ALLEN Teilflächen des großen Rechtecks: Dieser Anteil ist das Ergebnis der Malaufgabe.",
