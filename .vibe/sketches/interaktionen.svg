<svg xmlns="http://www.w3.org/2000/svg" width="1178" height="780"><rect x="0" y="0" width="1178" height="780" rx="0" fill="#f3f5f0" stroke="none"/><text x="25" y="42" font-family="Arial,sans-serif" font-size="30" fill="#20332e">Weitere interaktive Zustände</text><text x="25" y="74" font-family="Arial,sans-serif" font-size="17" fill="#20332e">Schematische Schritte im Modell; Anordnung und Seitenrahmen bleiben Aufgabe der Vorlage.</text><rect x="25" y="100" width="548" height="310" rx="8" fill="white" stroke="#e4e8e3"/><text x="45" y="135" font-family="Arial,sans-serif" font-size="22" fill="#20332e">Zahlenstrahl · 5/4 platzieren</text><g transform="translate(25,100)"><line x1="35" y1="130" x2="505" y2="130" stroke="#20332e" stroke-width="2"/><line x1="35.0" y1="120" x2="35.0" y2="140" stroke="#20332e"/><line x1="93.75" y1="120" x2="93.75" y2="140" stroke="#20332e"/><line x1="152.5" y1="120" x2="152.5" y2="140" stroke="#20332e"/><line x1="211.25" y1="120" x2="211.25" y2="140" stroke="#20332e"/><line x1="270.0" y1="120" x2="270.0" y2="140" stroke="#20332e"/><line x1="328.75" y1="120" x2="328.75" y2="140" stroke="#20332e"/><line x1="387.5" y1="120" x2="387.5" y2="140" stroke="#20332e"/><line x1="446.25" y1="120" x2="446.25" y2="140" stroke="#20332e"/><line x1="505.0" y1="120" x2="505.0" y2="140" stroke="#20332e"/><text x="30" y="169" font-family="Arial,sans-serif" font-size="18" fill="#20332e">0</text><text x="264" y="169" font-family="Arial,sans-serif" font-size="18" fill="#20332e">1</text><text x="496" y="169" font-family="Arial,sans-serif" font-size="18" fill="#20332e">2</text><circle cx="328.75" cy="130" r="9" fill="#16765d"/><text x="270" y="99" font-family="Arial,sans-serif" font-size="17" fill="#20332e">Eigene Position</text></g><text x="45" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">1. Einheit in Viertel unterteilen; Position wählen.</text><text x="45" y="355" font-family="Arial,sans-serif" font-size="16" fill="#20332e">2. Prüfen → Position erklären oder Hinweis geben.</text><text x="45" y="380" font-family="Arial,sans-serif" font-size="16" fill="#20332e">3. Über 1 hinaus weiterzählen; neue Aufgabe.</text><rect x="605" y="100" width="548" height="310" rx="8" fill="white" stroke="#e4e8e3"/><text x="625" y="135" font-family="Arial,sans-serif" font-size="22" fill="#20332e">Multiplikation · Anteil eines Anteils</text><g transform="translate(605,100)"><rect x="115" y="75" width="75" height="38" rx="0" fill="#16765d" stroke="#20332e"/><rect x="190" y="75" width="75" height="38" rx="0" fill="#16765d" stroke="#20332e"/><rect x="265" y="75" width="75" height="38" rx="0" fill="#16765d" stroke="#20332e"/><rect x="340" y="75" width="75" height="38" rx="0" fill="#fff" stroke="#20332e"/><rect x="115" y="113" width="75" height="38" rx="0" fill="#16765d" stroke="#20332e"/><rect x="190" y="113" width="75" height="38" rx="0" fill="#16765d" stroke="#20332e"/><rect x="265" y="113" width="75" height="38" rx="0" fill="#16765d" stroke="#20332e"/><rect x="340" y="113" width="75" height="38" rx="0" fill="#fff" stroke="#20332e"/><rect x="115" y="151" width="75" height="38" rx="0" fill="#d9eee4" stroke="#20332e"/><rect x="190" y="151" width="75" height="38" rx="0" fill="#d9eee4" stroke="#20332e"/><rect x="265" y="151" width="75" height="38" rx="0" fill="#d9eee4" stroke="#20332e"/><rect x="340" y="151" width="75" height="38" rx="0" fill="#fff" stroke="#20332e"/><text x="85" y="70" font-family="Arial,sans-serif" font-size="20" fill="#20332e">2/3 von 3/4</text></g><text x="625" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">1. Drei Viertel des Rechtecks wählen.</text><text x="625" y="355" font-family="Arial,sans-serif" font-size="16" fill="#20332e">2. Davon zwei Drittel markieren; Schnittfläche bilden.</text><text x="625" y="380" font-family="Arial,sans-serif" font-size="16" fill="#20332e">3. Bruch eingeben → prüfen → Regel begründen.</text><rect x="25" y="440" width="548" height="310" rx="8" fill="white" stroke="#e4e8e3"/><text x="45" y="475" font-family="Arial,sans-serif" font-size="22" fill="#20332e">Division · Stücke hineinlegen</text><g transform="translate(25,440)"><rect x="45.0" y="102" width="57.0" height="52" rx="0" fill="#16765d" stroke="#20332e"/><rect x="102.0" y="102" width="57.0" height="52" rx="0" fill="#16765d" stroke="#20332e"/><rect x="159.0" y="102" width="57.0" height="52" rx="0" fill="#16765d" stroke="#20332e"/><rect x="216.0" y="102" width="57.0" height="52" rx="0" fill="#16765d" stroke="#20332e"/><rect x="273.0" y="102" width="57.0" height="52" rx="0" fill="#16765d" stroke="#20332e"/><rect x="330.0" y="102" width="57.0" height="52" rx="0" fill="#16765d" stroke="#20332e"/><rect x="387.0" y="102" width="57.0" height="52" rx="0" fill="#fff" stroke="#20332e"/><rect x="444.0" y="102" width="57.0" height="52" rx="0" fill="#fff" stroke="#20332e"/><text x="45" y="90" font-family="Arial,sans-serif" font-size="18" fill="#20332e">Ausgangsstrecke: 3/4; Stückgröße: 1/8</text><text x="45" y="198" font-family="Arial,sans-serif" font-size="19" fill="#20332e">Wie viele Achtel passen hinein?  [ … ]</text></g><text x="45" y="670" font-family="Arial,sans-serif" font-size="16" fill="#20332e">1. 3/4 in Achtel unterteilen.</text><text x="45" y="695" font-family="Arial,sans-serif" font-size="16" fill="#20332e">2. Stücke legen und Anzahl eingeben.</text><text x="45" y="720" font-family="Arial,sans-serif" font-size="16" fill="#20332e">3. Prüfen → begründen → Kehrwertregel zeigen.</text><rect x="605" y="440" width="548" height="310" rx="8" fill="white" stroke="#e4e8e3"/><text x="625" y="475" font-family="Arial,sans-serif" font-size="22" fill="#20332e">Subtraktion · 3/4 − 1/2</text><g transform="translate(605,440)"><rect x="45.0" y="85" width="114.0" height="42" rx="0" fill="#16765d" stroke="#20332e"/><rect x="159.0" y="85" width="114.0" height="42" rx="0" fill="#16765d" stroke="#20332e"/><rect x="273.0" y="85" width="114.0" height="42" rx="0" fill="#16765d" stroke="#20332e"/><rect x="387.0" y="85" width="114.0" height="42" rx="0" fill="#fff" stroke="#20332e"/><text x="45" y="155" font-family="Arial,sans-serif" font-size="18" fill="#20332e">1/2 entspricht zwei Vierteln: wegnehmen.</text><rect x="45.0" y="171" width="114.0" height="32" rx="0" fill="#16765d" stroke="#20332e"/><rect x="159.0" y="171" width="114.0" height="32" rx="0" fill="#fff" stroke="#20332e"/><rect x="273.0" y="171" width="114.0" height="32" rx="0" fill="#fff" stroke="#20332e"/><rect x="387.0" y="171" width="114.0" height="32" rx="0" fill="#fff" stroke="#20332e"/></g><text x="625" y="670" font-family="Arial,sans-serif" font-size="16" fill="#20332e">1. Gemeinsame Unterteilung herstellen.</text><text x="625" y="695" font-family="Arial,sans-serif" font-size="16" fill="#20332e">2. Zwei Viertel entfernen.</text><text x="625" y="720" font-family="Arial,sans-serif" font-size="16" fill="#20332e">3. Rest als Bruch eingeben und prüfen.</text></svg>