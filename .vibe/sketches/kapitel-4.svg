<svg xmlns="http://www.w3.org/2000/svg" width="548" height="365" viewBox="0 0 548 365"><rect x="0" y="0" width="548" height="365" rx="8" fill="white" stroke="#e4e8e3"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" fill="#20332e">4 · Anteil, Bruchteil, Ganzes</text><text x="22" y="62" font-family="Arial,sans-serif" font-size="15" fill="#20332e">Aus einer Gruppe auf den gesuchten Wert schließen</text><rect x="30.0" y="110" width="120.0" height="58" rx="0" fill="#16765d" stroke="#20332e"/><rect x="150.0" y="110" width="120.0" height="58" rx="0" fill="#16765d" stroke="#20332e"/><rect x="270.0" y="110" width="120.0" height="58" rx="0" fill="#16765d" stroke="#20332e"/><rect x="390.0" y="110" width="120.0" height="58" rx="0" fill="#fff" stroke="#20332e"/><text x="34" y="200" font-family="Arial,sans-serif" font-size="20" fill="#20332e">Ganzes: 12       Anteil: 3/4       Bruchteil: ?</text><text x="48" y="244" font-family="Arial,sans-serif" font-size="18" fill="#20332e">12 : 4  →  eine Gruppe  →  dreimal nehmen</text><text x="22" y="280" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Zuerst Gegebenes und Gesuchtes zuordnen.</text><text x="22" y="305" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Gruppen bilden; fehlende Größe berechnen.</text><text x="22" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Die Lösung wird erst nach dem Prüfen eingeblendet.</text></svg>