<svg xmlns="http://www.w3.org/2000/svg" width="1192" height="1420" viewBox="0 0 1192 1420"><rect x="0" y="0" width="1192" height="1420" rx="0" fill="#f3f5f0" stroke="none"/><text x="32" y="45" font-family="Arial,sans-serif" font-size="34" fill="#20332e">Bruchrechnung – Schritt für Schritt</text><text x="32" y="78" font-family="Arial,sans-serif" font-size="19" fill="#20332e">Planungsskizze · Lerninteraktionen innerhalb der bestehenden Vorlage</text><text x="32" y="108" font-family="Arial,sans-serif" font-size="18" fill="#20332e">Jede Lernseite: Entdecken → Regel → Beispiel → Üben</text><g transform="translate(32,140)"><rect x="0" y="0" width="548" height="365" rx="8" fill="white" stroke="#e4e8e3"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" fill="#20332e">1 · Brüche darstellen</text><text x="22" y="62" font-family="Arial,sans-serif" font-size="15" fill="#20332e">Entdecken: derselbe Anteil in mehreren Modellen</text><path d="M92,148 L92.0,93.0 A55,55 0 0 1 147.0,148.0 Z" fill="#16765d" stroke="#20332e"/><path d="M92,148 L147.0,148.0 A55,55 0 0 1 92.0,203.0 Z" fill="#16765d" stroke="#20332e"/><path d="M92,148 L92.0,203.0 A55,55 0 0 1 37.0,148.0 Z" fill="#16765d" stroke="#20332e"/><path d="M92,148 L37.0,148.0 A55,55 0 0 1 91.99999999999999,93.0 Z" fill="white" stroke="#20332e"/><rect x="188.0" y="98" width="75.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="263.0" y="98" width="75.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="338.0" y="98" width="75.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="413.0" y="98" width="75.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><circle cx="204" cy="178" r="12" fill="#16765d"/><circle cx="250" cy="178" r="12" fill="#16765d"/><circle cx="296" cy="178" r="12" fill="#16765d"/><circle cx="342" cy="178" r="12" fill="#16765d"/><circle cx="388" cy="178" r="12" fill="#16765d"/><circle cx="434" cy="178" r="12" fill="#16765d"/><circle cx="204" cy="216" r="12" fill="#16765d"/><circle cx="250" cy="216" r="12" fill="#16765d"/><circle cx="296" cy="216" r="12" fill="#16765d"/><circle cx="342" cy="216" r="12" fill="#e4e8e3"/><circle cx="388" cy="216" r="12" fill="#e4e8e3"/><circle cx="434" cy="216" r="12" fill="#e4e8e3"/><text x="52" y="236" font-family="Arial,sans-serif" font-size="22" fill="#20332e">3/4</text><text x="22" y="280" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Zähler und Nenner verändern; Darstellung wechseln.</text><text x="22" y="305" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Üben: leere Teile selbst markieren oder Position wählen.</text><text x="22" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Prüfen: Anteil zählt, nicht die Anordnung der Teile.</text></g><g transform="translate(612,140)"><rect x="0" y="0" width="548" height="365" rx="8" fill="white" stroke="#e4e8e3"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" fill="#20332e">2 · Teilbarkeit nutzen</text><text x="22" y="62" font-family="Arial,sans-serif" font-size="15" fill="#20332e">Gemeinsame Unterteilungen aus Listen herleiten</text><text x="30" y="112" font-family="Arial,sans-serif" font-size="18" fill="#20332e">Teiler von 12:   1   2   3   4   6   12</text><text x="30" y="150" font-family="Arial,sans-serif" font-size="18" fill="#20332e">Teiler von 18:   1   2   3       6        9   18</text><rect x="25" y="175" width="495" height="60" rx="8" fill="#d9eee4" stroke="none"/><text x="40" y="212" font-family="Arial,sans-serif" font-size="21" fill="#20332e">Größter gemeinsamer Teiler:  [  …  ]</text><text x="22" y="280" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Listen vervollständigen und gemeinsame Werte erkennen.</text><text x="22" y="305" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Teilbarkeitsregeln und Primzahlen an Beispielen prüfen.</text><text x="22" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Rückmeldung unterscheidet Teiler und Vielfache.</text></g><g transform="translate(32,530)"><rect x="0" y="0" width="548" height="365" rx="8" fill="white" stroke="#e4e8e3"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" fill="#20332e">3 · Kürzen und Erweitern</text><text x="22" y="62" font-family="Arial,sans-serif" font-size="15" fill="#20332e">Unterteilung verändert sich – Anteil bleibt gleich</text><rect x="30.0" y="105" width="70.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="100.0" y="105" width="70.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="170.0" y="105" width="70.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><text x="263" y="133" font-family="Arial,sans-serif" font-size="28" fill="#20332e">→</text><rect x="305.0" y="105" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="340.0" y="105" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="375.0" y="105" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="410.0" y="105" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="445.0" y="105" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="480.0" y="105" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><text x="103" y="184" font-family="Arial,sans-serif" font-size="23" fill="#20332e">2/3</text><text x="380" y="184" font-family="Arial,sans-serif" font-size="23" fill="#20332e">4/6</text><rect x="140" y="206" width="270" height="38" rx="8" fill="#d9eee4" stroke="none"/><text x="156" y="232" font-family="Arial,sans-serif" font-size="18" fill="#20332e">Jedes Stück halbieren · ×2</text><text x="22" y="280" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Entdecken: Teile unterteilen oder zusammenfassen.</text><text x="22" y="305" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Üben: Faktor oder fehlenden Zähler/Nenner ergänzen.</text><text x="22" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Wertgleichheit prüfen; nur bei Auftrag ganz kürzen.</text></g><g transform="translate(612,530)"><rect x="0" y="0" width="548" height="365" rx="8" fill="white" stroke="#e4e8e3"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" fill="#20332e">4 · Anteil, Bruchteil, Ganzes</text><text x="22" y="62" font-family="Arial,sans-serif" font-size="15" fill="#20332e">Aus einer Gruppe auf den gesuchten Wert schließen</text><rect x="30.0" y="110" width="120.0" height="58" rx="0" fill="#16765d" stroke="#20332e"/><rect x="150.0" y="110" width="120.0" height="58" rx="0" fill="#16765d" stroke="#20332e"/><rect x="270.0" y="110" width="120.0" height="58" rx="0" fill="#16765d" stroke="#20332e"/><rect x="390.0" y="110" width="120.0" height="58" rx="0" fill="#fff" stroke="#20332e"/><text x="34" y="200" font-family="Arial,sans-serif" font-size="20" fill="#20332e">Ganzes: 12       Anteil: 3/4       Bruchteil: ?</text><text x="48" y="244" font-family="Arial,sans-serif" font-size="18" fill="#20332e">12 : 4  →  eine Gruppe  →  dreimal nehmen</text><text x="22" y="280" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Zuerst Gegebenes und Gesuchtes zuordnen.</text><text x="22" y="305" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Gruppen bilden; fehlende Größe berechnen.</text><text x="22" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Die Lösung wird erst nach dem Prüfen eingeblendet.</text></g><g transform="translate(32,920)"><rect x="0" y="0" width="548" height="365" rx="8" fill="white" stroke="#e4e8e3"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" fill="#20332e">5 · Rechnen mit Brüchen</text><text x="22" y="62" font-family="Arial,sans-serif" font-size="15" fill="#20332e">Beispiel Addition: erst gleiche Stückgrößen bilden</text><rect x="30.0" y="95" width="105.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="135.0" y="95" width="105.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><text x="267" y="125" font-family="Arial,sans-serif" font-size="25" fill="#20332e">+</text><rect x="305.0" y="95" width="70.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="375.0" y="95" width="70.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="445.0" y="95" width="70.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><text x="30" y="165" font-family="Arial,sans-serif" font-size="18" fill="#20332e">Unterteile beide Streifen in Sechstel.</text><rect x="30.0" y="192" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="65.0" y="192" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="100.0" y="192" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="135.0" y="192" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="170.0" y="192" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="205.0" y="192" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="305.0" y="192" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="340.0" y="192" width="35.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="375.0" y="192" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="410.0" y="192" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="445.0" y="192" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="480.0" y="192" width="35.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><text x="22" y="280" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Addition/Subtraktion: gleich unterteilen, zusammenfügen.</text><text x="22" y="305" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Multiplikation: Anteil eines Anteils im Rechteck.</text><text x="22" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Division: Wie oft passt ein Bruchstück hinein?</text></g><g transform="translate(612,920)"><rect x="0" y="0" width="548" height="365" rx="8" fill="white" stroke="#e4e8e3"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" fill="#20332e">6 · Dezimalzahlen und Alltag</text><text x="22" y="62" font-family="Arial,sans-serif" font-size="15" fill="#20332e">Darstellungen wechseln und Ergebnisse abschätzen</text><rect x="30.0" y="98" width="48.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="78.0" y="98" width="48.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="126.0" y="98" width="48.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="174.0" y="98" width="48.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="222.0" y="98" width="48.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="270.0" y="98" width="48.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="318.0" y="98" width="48.0" height="40" rx="0" fill="#16765d" stroke="#20332e"/><rect x="366.0" y="98" width="48.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="414.0" y="98" width="48.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><rect x="462.0" y="98" width="48.0" height="40" rx="0" fill="#fff" stroke="#20332e"/><text x="34" y="179" font-family="Arial,sans-serif" font-size="25" fill="#20332e">7/10  =  0,7  =  70/100</text><text x="34" y="224" font-family="Arial,sans-serif" font-size="18" fill="#20332e">3/4 Liter → [  …  ] Liter in Dezimalschreibweise</text><text x="22" y="280" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Stellenwerte nutzen; endliche und periodische Fälle.</text><text x="22" y="305" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Dezimalrechnung und Runden mit benannter Stelle.</text><text x="22" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Sachaufgaben: passende Rechnung, Einheit, Kontrolle.</text></g><text x="32" y="1356" font-family="Arial,sans-serif" font-size="18" fill="#20332e">Übungszustände: Aufgabe → eigene Eingabe → Prüfen → Hinweis oder Begründung → neue Aufgabe</text><text x="32" y="1386" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Tippen und Tastatur möglich. Kein Timer. Seitenaufbau, Navigation und Dunkelmodus kommen aus der Vorlage.</text></svg>