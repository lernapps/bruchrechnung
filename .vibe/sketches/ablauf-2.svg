<svg xmlns="http://www.w3.org/2000/svg" width="750" height="550"><rect x="0" y="0" width="750" height="550" rx="8" fill="white" stroke="none"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="24" fill="#20332e">Lernseite und Übungszustände</text><text x="24" y="72" font-family="Arial,sans-serif" font-size="16" fill="#20332e">Gemeinsame Struktur; Vorlage bestimmt Gestaltung und Anordnung.</text><rect x="24" y="95" width="700" height="55" rx="8" fill="#d9eee4" stroke="none"/><text x="40" y="128" font-family="Arial,sans-serif" font-size="17" fill="#20332e">1. Entdecken: Modell verändern, Zusammenhang beschreiben.</text><rect x="24" y="167" width="700" height="55" rx="8" fill="#f3f5f0" stroke="none"/><text x="40" y="200" font-family="Arial,sans-serif" font-size="17" fill="#20332e">2. Regel: kurze Erklärung mit Textalternative zum Bild.</text><rect x="24" y="239" width="700" height="55" rx="8" fill="#d9eee4" stroke="none"/><text x="40" y="272" font-family="Arial,sans-serif" font-size="17" fill="#20332e">3. Beispiel: Rechenschritte am Modell nachvollziehen.</text><rect x="24" y="311" width="700" height="55" rx="8" fill="#f3f5f0" stroke="none"/><text x="40" y="344" font-family="Arial,sans-serif" font-size="17" fill="#20332e">4. Üben: unbekannten Wert oder Modellzustand eingeben.</text><rect x="24" y="383" width="700" height="55" rx="8" fill="#d9eee4" stroke="none"/><text x="40" y="416" font-family="Arial,sans-serif" font-size="17" fill="#20332e">5. Prüfen: richtig mit Begründung / Fehler mit Hinweis.</text><rect x="24" y="455" width="700" height="55" rx="8" fill="#f3f5f0" stroke="none"/><text x="40" y="488" font-family="Arial,sans-serif" font-size="17" fill="#20332e">6. Neue Aufgabe: Zustand zurücksetzen, neue Werte.</text></svg>